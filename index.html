<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive archive showing the evolution of Come What May Tomorrow.">
  <meta name="theme-color" content="#3f3148">
  <title>Interactive Song Archive — Come What May Tomorrow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="site-shell">
    <section class="player" aria-labelledby="song-title">
      <div class="floating-images" aria-hidden="true">
        <img class="floating-image floating-image-01 parallax-element" src="assets/images/come-what-may-tomorrow-01.png" alt="">
        <img class="floating-image floating-image-02 parallax-element" src="assets/images/come-what-may-tomorrow-02.png" alt="">
        <img class="floating-image floating-image-03 parallax-element" src="assets/images/come-what-may-tomorrow-01.png" alt="">
        <img class="floating-image floating-image-04 parallax-element" src="assets/images/come-what-may-tomorrow-02.png" alt="">
        <img class="floating-image floating-image-05 parallax-element" src="assets/images/come-what-may-tomorrow-01.png" alt="">
        <img class="floating-image floating-image-06 parallax-element" src="assets/images/come-what-may-tomorrow-02.png" alt="">
        <img class="floating-image floating-image-07 parallax-element" src="assets/images/come-what-may-tomorrow-01.png" alt="">
      </div>

      <div class="artwork-wrap">
        <img class="album-art" src="assets/images/album-art.jpg" alt="Album artwork for Come What May Tomorrow">
      </div>

      <div class="song-info">
        <h1 id="song-title">Come What May Tomorrow</h1>
        <p class="artist-line" id="artist-kicker">by Jackson Moore</p>
        <div class="current-version" aria-live="polite">
          <p class="version-number" id="version-date">01 — DEMO</p>
          <h2 id="version-title">The Original Instrumental</h2>
          <p id="version-description">The first recorded version of the song.</p>
        </div>
      </div>
    </section>

    <section class="timeline-section" aria-label="Song playback and timeline">
      <div class="timeline-heading">
        <div class="play-area">
          <button class="play-button" id="play-button" type="button" disabled>
            <span id="play-label">LOADING</span>
            <span class="button-indicator" aria-hidden="true"></span>
          </button>
          <p class="status" id="status" role="status">Preparing audio…</p>
        </div>
        <p class="time-readout"><span id="current-time">0:00</span> / <span id="duration">2:31</span></p>
      </div>
      <div class="timeline-control">
        <input class="version-slider" id="version-slider" type="range" min="0" max="4" value="0" step="0.001" aria-label="Move through the song versions">
        <div class="stage-points" id="stage-points"></div>
      </div>
    </section>

    <section class="waveform-section" aria-label="Audio waveform">
      <canvas id="waveform" aria-hidden="true"></canvas>
    </section>

    <footer class="site-footer">
      <span>Interactive song archive | <span class="footer-song-name">Come What May Tomorrow</span></span>
      <nav class="footer-links" aria-label="Site and music links">
        <a href="about.html">ABOUT</a>
        <a href="https://open.spotify.com/artist/7njkLldCadYfsRvvedCBV6" target="_blank" rel="noopener noreferrer">SPOTIFY</a>
        <a href="https://music.apple.com/au/artist/jackson-moore/6800161995" target="_blank" rel="noopener noreferrer">APPLE MUSIC</a>
      </nav>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
